name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: cross-compile
        run: |
          for target in linux/arm64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t discogsctl .
      # No request reaches Discogs from CI: version prints locally, and an
      # invalid id is refused before any request is sent.
      - name: image runs and keeps the exit status
        run: |
          docker run --rm discogsctl version | grep -qx 'discogsctl dev'
          code=0
          docker run --rm discogsctl release get 0 || code=$?
          test "$code" -eq 1
